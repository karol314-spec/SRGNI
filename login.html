<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SRGNI - Iniciar sesión</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-card">

        <!-- LOGO -->
        <a href="index.html" class="login-logo-link">
            <img src="imagenes/logo.png" class="login-logo" alt="SRGNI">
        </a>

        <span class="login-tag">
            SISTEMA DE REGISTRO DE NOTAS
        </span>


        <!-- =========================
             INICIO DE SESIÓN
        ========================== -->

        <div id="loginSection">

            <h1>Iniciar sesión</h1>

            <p class="login-text">
                Accede a SRGNI para consultar y administrar
                la información académica.
            </p>


            <!-- PESTAÑAS -->

            <div class="login-tabs">

                <button
                    type="button"
                    id="loginTab"
                    class="login-tab active">
                    Iniciar sesión
                </button>

                <button
                    type="button"
                    id="registerTab"
                    class="login-tab">
                    Registrarse
                </button>

            </div>


            <!-- FORMULARIO LOGIN -->

            <form id="loginForm" class="login-form">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                    autocomplete="username">


                <label for="password">
                    Contraseña
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                        autocomplete="current-password">

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword">
                        👁
                    </button>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Ingresar

                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite">
                </p>

            </form>


            <p class="register-question">
                ¿Aún no tienes cuenta?
                <button
                    type="button"
                    id="openRegister">
                    Regístrate
                </button>
            </p>

        </div>



        <!-- =========================
             REGISTRO
        ========================== -->

        <div
            id="registerSection"
            class="register-section">

            <h1>Crear cuenta</h1>

            <p class="login-text">
                Regístrate en SRGNI para acceder al sistema académico.
            </p>


            <!-- PESTAÑAS -->

            <div class="login-tabs">

                <button
                    type="button"
                    id="loginTab2"
                    class="login-tab">

                    Iniciar sesión

                </button>

                <button
                    type="button"
                    id="registerTab2"
                    class="login-tab active">

                    Registrarse

                </button>

            </div>


            <!-- FORMULARIO REGISTRO -->

            <form
                id="registerForm"
                class="login-form">


                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre completo"
                    required>


                <label for="correoRegistro">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correoRegistro"
                    name="correoRegistro"
                    placeholder="tucorreo@institucion.edu.co"
                    required>


                <label for="tipoUsuario">
                    Tipo de usuario
                </label>

                <select
                    id="tipoUsuario"
                    name="tipoUsuario"
                    required>

                    <option value="">
                        Selecciona una opción
                    </option>

                    <option value="estudiante">
                        Estudiante
                    </option>

                    <option value="docente">
                        Docente
                    </option>

                </select>


                <label for="passwordRegistro">
                    Contraseña
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="passwordRegistro"
                        name="passwordRegistro"
                        placeholder="Mínimo 6 caracteres"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleRegisterPassword">

                        👁

                    </button>

                </div>


                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repite tu contraseña"
                    minlength="6"
                    required>


                <button
                    type="submit"
                    class="login-button">

                    Crear cuenta

                </button>


                <p
                    id="registerMessage"
                    class="login-message"
                    aria-live="polite">
                </p>

            </form>


            <p class="register-question">

                ¿Ya tienes una cuenta?

                <button
                    type="button"
                    id="backToLogin">

                    Inicia sesión

                </button>

            </p>

        </div>


        <!-- VOLVER AL INICIO -->

        <a
            href="index.html"
            class="back-link">

            ← Volver al inicio

        </a>

    </main>


    <script src="scrip.js"></script>

</body>

</html>
